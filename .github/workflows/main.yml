name: Keep Streamlit app awake

# Streamlit Community Cloud sleeps apps after 12 hours without traffic.
# This opens the app in a headless browser every 4 hours so it never reaches that limit.
on:
  schedule:
    - cron: "23 */4 * * *"   # every 4 hours at :23 (UTC); off the hour because GitHub delays top-of-hour jobs
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: read
  actions: write              # only used by the last step, to keep this schedule enabled

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A repository variable STREAMLIT_APP_URL overrides this if the app ever moves.
      APP_URL: ${{ vars.STREAMLIT_APP_URL || 'https://rajasthanroyals.streamlit.app/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Visit the app (wakes it if asleep)
        run: python .github/scripts/keep_awake.py

      - name: Upload screenshot if the app did not load
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure
          path: keep_awake_failure.png
          if-no-files-found: ignore

      # GitHub turns off scheduled workflows in repos with no activity for 60 days.
      # Re-enabling the workflow through the API counts as activity and keeps the schedule running.
      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keep-awake.yml --repo "${{ github.repository }}" || true
