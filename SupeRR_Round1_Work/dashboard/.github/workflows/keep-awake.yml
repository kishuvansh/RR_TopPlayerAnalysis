name: Keep Streamlit App Awake

on:
  schedule:
    # Streamlit Community Cloud puts apps to sleep after ~12 hours of inactivity.
    # Runs every 4 hours at :15 past the hour (UTC) to keep the app continuously warm.
    - cron: "15 */4 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: read
  actions: write # Used to keep schedule enabled after 60 days of repo inactivity

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  wake-app:
    name: Visit Streamlit App (Headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Selenium & Driver Manager
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      - name: Run Awake Script
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL || 'https://rajasthanroyals.streamlit.app/' }}
          EXPECT_TEXT: "Rinku Singh"
          TIMEOUT_S: "240"
        run: |
          python .github/scripts/keep_awake.py

      - name: Upload Screenshot on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure-screenshot
          path: keep_awake_failure.png
          if-no-files-found: ignore

      - name: Keep schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable keep-awake.yml --repo "${{ github.repository }}" || true
